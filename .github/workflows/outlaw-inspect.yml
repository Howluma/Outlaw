name: Inspect original OutlawSMP JAR
on:
  push:
    branches: [feature/outlaw-smp-improvements]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and decompile original JAR
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ALL JAR ENTRIES ==='
          jar tf OutlawSMP.jar
          echo '=== CONFIGURATION ==='
          unzip -p OutlawSMP.jar config.yml || true
          curl -fLsS --retry 2 -o /tmp/cfr.jar https://www.benf.org/other/cfr/cfr-0.152.jar
          mkdir -p decompiled-reference
          java -jar /tmp/cfr.jar OutlawSMP.jar --outputdir decompiled-reference --silent true --caseinsensitivefs false || true
          echo '=== DECOMPILED FILES ==='
          find decompiled-reference -name '*.java' | head -100
          echo '=== TOTAL JAVA FILES ==='
          find decompiled-reference -name '*.java' | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decompiled-reference
          if ! git diff --cached --quiet; then
            git commit -m 'Add decompiled inspection reference from original JAR'
            git push origin HEAD:feature/outlaw-smp-improvements
          fi
