# Test build. Only TNT scaling is enabled by default.
tnt:
  enabled: true
  other-damage-multiplier: 1.25
  igniter-damage-multiplier: 0.50

perks:
  quickdraw:
    # Requires disabling the original plugin's fixed-level quickdraw behavior;
    # vendor config and original event loop must be tested first.
    enabled: false
    vendor-fixed-level-disabled-confirmed: false

  blacksmith:
    # Adds one COBWEB -> two COBWEBs, and an iron-nugget+stick BREEZE_ROD.
    # Uses PlaceholderAPI to ensure only Blacksmith perk owners can craft.
    # Off until the original plugin is tested for recipe collisions.
    new-recipes-enabled: false
  # Enable ONLY AFTER setting OutlawSMP's native
  # perks.toughness.damage-reduction to 0.0 in plugins/OutlawSMP/config.yml.
  toughness:
    enabled: false
    damage-multiplier: 0.975

  # Enable ONLY AFTER setting OutlawSMP's native
  # perks.sharpshooter.damage-bonus to 0.0.
  # Velocity boost is provisional and configurable because no target was specified.
  sharpshooter:
    enabled: false
    projectile-velocity-multiplier: 1.25

# Optional Swift replacement, disabled until validated with the vendor's
# /abilityuse event order. Only replaces a 10s PLUGIN-applied Speed II effect.
skills:
  lifestealer:
    # Experimental: cancel vendor Regeneration I gained on a Lifestealer hit
    # and heal for actual health lost by victim after damage mitigation.
    # Requires exact event-order confirmation on a test server.
    convert-regeneration: false
    vendor-regen-ticks: 60
  tank:
    # Experimental: re-enable player's own wind-charge knockback when Tank selected.
    # Not guaranteed against a different plugin cancelling after this handler.
    wind-charge-knockback-fix: false
  swift:
    enabled: false
    duration-seconds: 10

# Head anti-farming mitigates repeated kills, not pre-existing/duped skulls
# or the vendor sheriff's unverified redemption code.
heads:
  anti-farm:
    enabled: true
    killer-victim-cooldown-minutes: 60
    victim-cooldown-minutes: 10
